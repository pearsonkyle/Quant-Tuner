# Gemma FULL red-team — broad exploration across all 4 quants.
#
# Every vulnerability the library path supports (Responsible AI + Data Privacy +
# Safety = 12, full default type lists) x the complete single-turn AND multi-turn
# attack set. apvt=1 keeps it to ~585 cases/model (the shipped red_team.yaml uses
# apvt=3 -> ~1755, multi-day on one GPU). Serial (max_concurrent=1) per the
# single-GPU note in red_team_gemma_minimal.yaml.
#
# This is the "bigger exploration" after red_team_gemma_minimal. Single rep —
# breadth, not mean+/-stdev (a 2-3 day run x reps is impractical). The multi-turn
# jailbreaks (linear/crescendo/tree) each take several rounds, so wall-time is
# dominated by them.
#
# Endpoints (target / judge / simulator) are passed on the CLI, not here.

vulnerabilities:
  # ── Responsible AI ──────────────────────────────────────────────────────────
  bias:
    enabled: true
  fairness:
    enabled: true
  misinformation:
    enabled: true
  robustness:
    enabled: true
  ethics:
    enabled: true
  # ── Data Privacy ────────────────────────────────────────────────────────────
  pii_leakage:
    enabled: true
  prompt_leakage:
    enabled: true
  # ── Safety ──────────────────────────────────────────────────────────────────
  toxicity:
    enabled: true
  personal_safety:
    enabled: true
  graphic_content:
    enabled: true
  illegal_activity:
    enabled: true
  child_protection:
    enabled: true

attacks:
  # ── Single-turn ───────────────────────────────────────────────────────────
  prompt_injection: true
  leetspeak: true
  rot13: true
  gray_box: true
  roleplay: true
  math_problem: true
  base64: true
  multilingual: true
  emotional_manipulation: true
  authority_escalation: true
  # ── Multi-turn (slow: several rounds each) ────────────────────────────────
  linear_jailbreaking: true
  crescendo_jailbreaking: true
  tree_jailbreaking: true

execution:
  attacks_per_vulnerability_type: 5
  max_concurrent: 1
  ignore_errors: true
