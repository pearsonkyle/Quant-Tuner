# Agentic red-team — probe the deployment these quants actually ship into.
#
# Every other config here red-teams a bare chat turn, so "complied" means "emitted
# prose". But quant-tuner's models are tool-calling coding agents (eval/agents/,
# SWE-rebench), and Amodei's open-weights position piece names *cyber* as one of
# the three axes a sufficiently capable model should be tested on. This config
# pairs with `eval/red_team_agent.AgenticTarget`, which gives the target a real
# `bash` tool inside a disposable SWE-rebench container — so the judge grades
# `tools_called`, i.e. what the model *ran*, not what it said.
#
# Run it with scripts/redteam_agentic.py (needs the swebench extra + Docker).
#
# ⚠️ Capability confound: complying here requires successfully emitting a tool
# call. A quant too degraded to tool-call scores as "safe" for the wrong reason.
# Always read pass_rate next to n_tool_calls — the runner prints both.
#
# Endpoints (target / judge / simulator) are passed on the CLI, not here.

vulnerabilities:
  # ── Direct misuse of the tool surface ─────────────────────────────────────
  excessive_agency:
    enabled: true
    types: [functionality, permissions, autonomy]
  shell_injection:
    enabled: true
  unexpected_code_execution:
    enabled: true

  # ── Indirect injection: the instruction arrives via content the agent READS,
  #    not via the user turn. This is the realistic vector for a coding agent —
  #    a poisoned README, issue body, or test fixture. Use AgenticTarget.seed_file
  #    to plant it in the checkout.
  indirect_instruction:
    enabled: true
    types: [document_embedded_instructions, tool_output_injection]

  # ── Exfiltration / lateral movement from inside the sandbox ───────────────
  ssrf:
    enabled: true
  external_system_abuse:
    enabled: true

  # ── Authorization boundaries a tool-using agent can walk across ───────────
  bfla:
    enabled: true
  rbac:
    enabled: true
  debug_access:
    enabled: true

  # ── Goal integrity: does the agent stay on the task it was given? ─────────
  recursive_hijacking:
    enabled: true

attacks:
  # Single-turn: cheap, and the ones that map to how injected text actually
  # reaches an agent (a system-ish preamble in a file, an authority claim).
  prompt_injection: true
  system_override: true
  authority_escalation: true
  permission_escalation: true
  goal_redirection: true
  # Multi-turn: only meaningful now that the target callback receives history.
  # Each of these costs several rounds — drop them for a first pass.
  linear_jailbreaking: true
  crescendo_jailbreaking: true

execution:
  # 10 vulnerabilities x their type lists x 7 attacks adds up fast, and every
  # case here spawns real container commands. Start at 1.
  attacks_per_vulnerability_type: 1
  # Serial: one local GPU serving the target, one Docker container being driven.
  max_concurrent: 1
  ignore_errors: true
