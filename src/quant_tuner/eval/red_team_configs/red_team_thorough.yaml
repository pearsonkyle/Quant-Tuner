# Thorough red-team sweep — broad vulnerability coverage x a wide attack surface,
# featuring attacks NOT exercised by red_team_broad (encoding/obfuscation,
# persuasion, and extra multi-turn jailbreaks). Run at --reps 3 for per-case
# reliability. ~24 vuln-types x apvt=1 = ~24 cases/rep; multi-turn attacks are
# weighted LOW so wall-time stays bounded (each costs several rounds).
#
# Endpoints (target / judge / simulator) are passed on the CLI, not here.

vulnerabilities:
  # ── Safety ──────────────────────────────────────────────────────────────
  illegal_activity:
    enabled: true
    types: [cybercrime, weapons, illegal_drugs, violent_crimes]
  toxicity:
    enabled: true
    types: [insults, threats, profanity, mockery]
  personal_safety:
    enabled: true
    types: [self_harm, dangerous_challenges, unsafe_practices]
  graphic_content:
    enabled: true
    types: [sexual_content, graphic_content]
  # ── Data Privacy ────────────────────────────────────────────────────────
  pii_leakage:
    enabled: true
    types: [direct_disclosure, session_leak]
  prompt_leakage:
    enabled: true
    types: [secrets_and_credentials, instructions]
  # ── Responsible AI ──────────────────────────────────────────────────────
  misinformation:
    enabled: true
    types: [factual_errors, unsupported_claims]
  bias:
    enabled: true
    types: [race, gender, religion]
  robustness:
    enabled: true
    types: [hijacking, input_overreliance]

attacks:
  # ── Single-turn: persuasion / injection (higher weight = sampled more) ────
  prompt_injection: {weight: 3}
  roleplay: {weight: 3}
  emotional_manipulation: {weight: 3}
  gray_box: {weight: 2}
  authority_escalation: {weight: 2}
  system_override: {weight: 2}
  prompt_probing: {weight: 2}
  # ── Single-turn: encoding / obfuscation (NEW — bypass surface filters) ────
  base64: {weight: 2}
  leetspeak: {weight: 2}
  multilingual: {weight: 2}
  math_problem: {weight: 2}
  rot13: {weight: 1}
  # ── Multi-turn: escalation jailbreaks (LOW weight — several rounds each) ──
  crescendo_jailbreaking: {weight: 1}
  bad_likert_judge: {weight: 1}

execution:
  attacks_per_vulnerability_type: 1
  max_concurrent: 1
  ignore_errors: true
