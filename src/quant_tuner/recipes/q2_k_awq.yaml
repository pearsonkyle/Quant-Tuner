# Activation-aware weight scaling (AWQ) → Q2_K (~2.6 bpw).
#
# Low-bit preset. The α grid search automatically uses the `q2k_b16` proxy
# (asymmetric per-16-element-block 2-bit RTN, the shape of Q2_K's error) —
# the default INT4 proxy systematically over-rewards channels that a 2-bit
# grid actually loses. Q2_K is itself a *mixed* quant (llama-quantize bumps
# attn_v to Q4_K on GQA/MoE >= 4 models, else Q3_K, and ffn_down to Q3_K on
# every layer), so the pipeline also enables the per-member proxy mix
# (`proxy_mix: Q2_K`): v_proj is scored with the proxy matching its real
# target type instead of the 2-bit one. Pin `proxy` to opt out. The final
# llama-quantize imatrix is collected on the AWQ-folded F16 and re-weighted
# with the `hybrid_custom` variant: at 2 bits an uncalibrated or weakly
# calibrated quant degrades catastrophically, so both calibrations are
# stacked by default.
name: q2_k_awq

model: PLACEHOLDER

workspace: ./out/q2_k_awq

data:
  logs: PLACEHOLDER
  train_frac: 0.8
  test_frac: 0.1
  holdout_frac: 0.1
  train_max_tokens: 250000
  eval_max_tokens: 50000
  supplement: ./calibration_supplement.txt
  context_len: 16384

calibration:
  method: awq
  variant: best             # grid-searched α per group
  params:
    proxy_tokens: 256
    # proxy: q2k_b16        # auto-selected from quantize.type; uncomment to pin
    imatrix_variant: hybrid_custom
    # Fold-stage params (routed to awq.apply):
    rmsnorm_plus_one: true  # true for Qwen3.5; false for Llama/Mistral/Qwen3
    sanity_max_rel: 0.03    # the fold itself is still F16-exact at any target bpw

quantize:
  type: Q2_K

bench:
  suite: full
  eval_ctx: 8192
