# IQ4_XS (~4.3 bpw) for the pruned-vocabulary gemma-4-E4B.
#
# a non-uniform codebook; usually better per bit, but NOT what the QAT saw.
#
# THE LADDER STOPS AT 4 BITS ON PURPOSE. The base is the `-qat-q4_0-unquantized`
# release, conditioned during training for the q4_0 grid, so spending 5 or 6 bits
# buys precision the weights were never trained to carry -- the QAT already
# collapsed them onto a 4-bit lattice. Below q4_0 the conditioning stops helping
# too (IQ3_M and IQ2_M are coarser and non-uniform, nothing like the grid QAT
# targeted), so those rungs are pure compression and depend far more on the
# imatrix being drawn from the real serving distribution.
#
# Pass --model (the stage-1 checkpoint). The corpus is prebuilt, not packed from
# logs: `calibration-15m-v65536-ctx32k`, in which every conversation fits WHOLE
# inside one 32,768-token window. llama-imatrix chunks by token count and knows
# nothing about conversation boundaries, so a longer session would reach it as
# fragments -- a middle fragment with no system prompt and no tool schemas, a
# context that never occurs at inference.
#
# Special tokens are load-bearing and handled: llama_cpp.imatrix defaults
# --parse-special on, so the chat markers tokenize as the single ids this
# vocabulary actually uses (<bos> 2, <|turn> 79, <|tool> 45, <tool|> 46) rather
# than as literal BPE text. Tool schemas render as <|tool>declaration:...<tool|>
# and reasoning as reasoning_content -- both verified present in the corpus.
name: iq4_xs_e4b_v65536

model: PLACEHOLDER

workspace: ./out/iq4_xs_e4b_v65536

data:
  logs: null
  corpus: ./out/cal-15m-ctx32k/corpus.cal.txt
  context_len: 32768

calibration:
  method: gptq
  variant: default
  params:
    tokens: 15000000
    ctx: 32768
    dampen: 0.01
    actorder: true
    # 457 imatrix chunks over 15M tokens. Higher ctx trades chunks away and
    # gemma-4 cannot use it: 35 of 42 layers are sliding attention over a
    # 512-token window, so past a few thousand tokens the benefit reaches only
    # 7 of 42 layers while all 42 pay the chunk-count cost.
    imatrix_ctx: 32768

quantize:
  type: IQ4_XS

bench:
  suite: full
  eval_ctx: 8192
  # Held-out (test slice of the seeded split), disjoint from calibration.
  # NOTE: chat-templated, and llama-perplexity has no --parse-special, so
  # absolute PPL is off-distribution; quant-vs-quant on this file stays valid.
  eval_corpus: ./out/cal-15m-ctx32k/corpus.eval.agentic.txt
