# Hessian-based weight rounding (GPTQ) → Q4_K_M.
#
# GPTQ rewrites the weights themselves toward an INT4 g32 grid, with error
# compensation across columns. After applying, the F16 GGUF is run through
# `verify_perplexity` against the baseline F16 PPL — if the ratio exceeds 1.5
# the recipe aborts before wasting time on the final quantize step. This is
# the guard against the IQ3_S-style catastrophic blowup observed in the
# source experiment leaderboard.
name: q4_k_m_gptq

model: PLACEHOLDER

workspace: ./out/q4_k_m_gptq

data:
  logs: PLACEHOLDER
  train_frac: 0.8
  test_frac: 0.1
  holdout_frac: 0.1
  train_max_tokens: 250000
  eval_max_tokens: 50000
  supplement: ./calibration_supplement.txt
  context_len: 16384

calibration:
  method: gptq
  variant: default
  params:
    # tokens/ctx go to gptq.calibrate (Hessian accumulation); the rest are
    # routed to gptq.apply. When n_bits/group_size/sym are omitted, they are
    # auto-derived from quantize.type (see gptq.grid_for_quant_type) and the
    # per-tensor grid mix kicks in: Q4_K_M bumps attn_v + ffn_down to Q6_K on
    # llama.cpp's use_more_bits layer schedule, so those tensors are rounded
    # at 6 bits. Pin n_bits/group_size/sym to reproduce the pre-mix behavior
    # (uniform 4-bit sym g32 everywhere).
    tokens: 32768          # larger than imatrix/AWQ — Hessians need more samples
    ctx: 2048
    dampen: 0.01
    actorder: true
    sanity_max_rel: 0.5    # logit-drift bound after rounding
    ppl_max_ratio: 1.5     # verify_perplexity threshold against F16 reference
    # imatrix_variant: hybrid_custom  # optional second-stage re-weighting
    # Mac (Apple Silicon):
    # device: mps           # auto already prefers mps when present
    # dtype: float16        # M1-generation GPUs lack bf16
    # hessian_device: auto  # default: Hessians stay on-device under MPS
    # layers_per_pass: 4    # bound peak Hessian RAM on big models

quantize:
  type: Q4_K_M

bench:
  suite: full
  eval_ctx: 8192
