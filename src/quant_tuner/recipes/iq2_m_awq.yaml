# Activation-aware weight scaling (AWQ) → IQ2_M (~2.7 bpw).
#
# Same low-bit preset as q2_k_awq: `q2k_b16` α-search proxy (auto-selected
# from quantize.type) + `hybrid_custom` re-weighting of the folded-F16
# imatrix. IQ2_* REQUIRES an imatrix — llama-quantize refuses to produce it
# without one, and the pipeline rejects method `none` for IQ1/IQ2 up front.
name: iq2_m_awq

model: PLACEHOLDER

workspace: ./out/iq2_m_awq

data:
  logs: PLACEHOLDER
  train_frac: 0.8
  test_frac: 0.1
  holdout_frac: 0.1
  train_max_tokens: 250000
  eval_max_tokens: 50000
  supplement: ./calibration_supplement.txt
  context_len: 16384

calibration:
  method: awq
  variant: best
  params:
    proxy_tokens: 256
    # proxy: q2k_b16        # auto-selected from quantize.type; uncomment to pin
    imatrix_variant: hybrid_custom
    rmsnorm_plus_one: true  # true for Qwen3.5; false for Llama/Mistral/Qwen3
    sanity_max_rel: 0.03

quantize:
  type: IQ2_M

bench:
  suite: full
  eval_ctx: 8192
