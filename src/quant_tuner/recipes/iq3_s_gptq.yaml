# Hessian-based weight rounding (GPTQ) → IQ3_S (~3.4 bpw).
#
# Low-bit preset: 3-bit asymmetric per-16-element-block grid auto-derived
# from quantize.type, guardrails auto-relaxed for 3-bit (sanity_max_rel
# 0.75, ppl_max_ratio 2.0). This is the configuration that guards against
# the catastrophic `gptq__IQ3_S` blowup from the source experiment
# leaderboard — verify_perplexity aborts before the final quantize if the
# rounded F16 diverges.
name: iq3_s_gptq

model: PLACEHOLDER

workspace: ./out/iq3_s_gptq

data:
  logs: PLACEHOLDER
  train_frac: 0.8
  test_frac: 0.1
  holdout_frac: 0.1
  train_max_tokens: 250000
  eval_max_tokens: 50000
  supplement: ./calibration_supplement.txt
  context_len: 16384

calibration:
  method: gptq
  variant: default
  params:
    tokens: 32768
    ctx: 2048
    dampen: 0.01
    actorder: true
    # n_bits: 3             # auto from quantize.type (IQ3 -> 3-bit asym g16)
    # group_size: 16
    # sym: false
    # sanity_max_rel: 0.75  # auto-relaxed for 3-bit
    # ppl_max_ratio: 2.0    # auto-relaxed for 3-bit

quantize:
  type: IQ3_S

bench:
  suite: full
  eval_ctx: 8192
