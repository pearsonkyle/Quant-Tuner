# Hessian-based weight rounding (GPTQ) → IQ2_M (~2.7 bpw).
#
# 2-bit ladder rung. Grid auto-derived (2-bit asym min+scale per-16); the
# per-tensor grid mix rounds the tensors llama-quantize bumps (attn_v ->
# Q4_K under GQA>=4, else IQ3_S; attn_output -> IQ3_S; first-eighth
# ffn_down -> IQ3_S) on their real 3/4-bit grids. Guardrails auto-relaxed
# for 2-bit (sanity_max_rel 1.0, ppl_max_ratio 4.0). IQ2 requires an
# imatrix — the GPTQ path collects one on the rounded F16 and (here) stacks
# the hybrid_custom re-weighting on top, mirroring the shipped 2-bit
# winners (IQ2_M + hybrid imatrix).
name: iq2_m_gptq

model: PLACEHOLDER

workspace: ./out/iq2_m_gptq

data:
  logs: PLACEHOLDER
  train_frac: 0.8
  test_frac: 0.1
  holdout_frac: 0.1
  train_max_tokens: 250000
  eval_max_tokens: 50000
  supplement: ./calibration_supplement.txt
  context_len: 16384

calibration:
  method: gptq
  variant: default
  params:
    tokens: 32768
    ctx: 2048
    dampen: 0.01
    actorder: true
    imatrix_variant: hybrid_custom
    # grid_mix: IQ2_M       # auto from quantize.type
    # sanity_max_rel: 1.0   # auto-relaxed for 2-bit
    # ppl_max_ratio: 4.0    # auto-relaxed for 2-bit
    # Mac (Apple Silicon):
    # device: mps           # auto already prefers mps when present
    # dtype: float16        # M1-generation GPUs lack bf16
    # hessian_device: auto  # default: Hessians stay on-device under MPS
    # layers_per_pass: 4    # bound peak Hessian RAM on big models

quantize:
  type: IQ2_M

bench:
  suite: full
  eval_ctx: 8192
