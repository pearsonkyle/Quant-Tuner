# GPTQ -> IQ2_M at 32K ctx
#
# IQ2_M GGUF via GPTQ, calibrated on a 32K-context window over the
# llmtk-sft corpus. `tokens: 32768` + `ctx: 32768` mean the Hessian
# accumulation sees 32K tokens in one context (the corpus is pre-packed at
# 32K windows, so the calibrator reads whole 32K contexts, not 2048-token
# fragments). Grid is auto-derived from IQ2_M; the per-tensor grid mix
# rounds the tensors llama-quantize bumps on their real grids. Guardrails
# auto-relax at 2-3 bits (sanity_max_rel 1.0/0.75, ppl_max_ratio 4.0/2.0).
name: iq2m_gptq_32k

model: PLACEHOLDER

workspace: ./out/iq2m_gptq_32k

data:
  logs: PLACEHOLDER
  train_frac: 0.8
  test_frac: 0.1
  holdout_frac: 0.1
  train_max_tokens: 1000000
  eval_max_tokens: 50000
  context_len: 32768

calibration:
  method: gptq
  variant: default
  params:
    tokens: 32768
    ctx: 32768
    dampen: 0.01
    actorder: true
    imatrix_variant: hybrid_custom
    # grid_mix: IQ2_M       # auto from quantize.type
    # Mac (Apple Silicon):
    # device: mps             # auto already prefers mps when present
    # dtype: float16          # M1-generation GPUs lack bf16
    # hessian_device: auto    # default: Hessians stay on-device under MPS
    # layers_per_pass: 4      # bound peak Hessian RAM on big models

quantize:
  type: IQ2_M

bench:
  suite: full
  eval_ctx: 8192
