# Hessian-based weight rounding (GPTQ) → IQ3_M (~3.7 bpw).
#
# 3-bit ladder rung. Grid auto-derived (3-bit asym min+scale per-16); the
# per-tensor grid mix rounds the tensors llama-quantize bumps (attn_v and
# attn_output -> Q4_K always, first-eighth ffn_down -> Q4_K) on the 4-bit
# grid. Guardrails auto-relaxed for 3-bit (sanity_max_rel 0.75,
# ppl_max_ratio 2.0).
name: iq3_m_gptq

model: PLACEHOLDER

workspace: ./out/iq3_m_gptq

data:
  logs: PLACEHOLDER
  train_frac: 0.8
  test_frac: 0.1
  holdout_frac: 0.1
  train_max_tokens: 250000
  eval_max_tokens: 50000
  supplement: ./calibration_supplement.txt
  context_len: 16384

calibration:
  method: gptq
  variant: default
  params:
    tokens: 32768
    ctx: 2048
    dampen: 0.01
    actorder: true
    # imatrix_variant: hybrid_custom  # optional second-stage re-weighting
    # grid_mix: IQ3_M       # auto from quantize.type
    # sanity_max_rel: 0.75  # auto-relaxed for 3-bit
    # ppl_max_ratio: 2.0    # auto-relaxed for 3-bit
    # Mac (Apple Silicon):
    # device: mps           # auto already prefers mps when present
    # dtype: float16        # M1-generation GPUs lack bf16
    # hessian_device: auto  # default: Hessians stay on-device under MPS
    # layers_per_pass: 4    # bound peak Hessian RAM on big models

quantize:
  type: IQ3_M

bench:
  suite: full
  eval_ctx: 8192
