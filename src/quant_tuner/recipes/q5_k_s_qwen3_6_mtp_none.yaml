# Qwen3.6-27B Q5_K_S with NO calibration — floor for the leaderboard.
#
# Quantizes the F16 GGUF directly with `llama-quantize`, no imatrix. Keeps the
# MTP head bundled in the GGUF (same extract config as the calibrated runs).
name: q5_k_s_qwen3_6_mtp_none

model: Qwen/Qwen3.6-27B

workspace: ./out/q5_k_s_qwen3_6_mtp_none

data:
  logs: PLACEHOLDER     # only used to build the eval text slice
  train_frac: 0.8
  test_frac: 0.1
  holdout_frac: 0.1
  train_max_tokens: 250000
  eval_max_tokens: 50000
  supplement: ./calibration_supplement.txt
  context_len: 16384

extract:
  keep_mtp: true

calibration:
  method: none
  variant: default
  params: {}

quantize:
  type: Q5_K_S

bench:
  suite: full
  eval_ctx: 8192
