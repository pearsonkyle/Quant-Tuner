# DiffusionGemma 26B-A4B (Gemma-4 MoE block-diffusion) — AWQ → IQ2_M (~2.7 bpw).
#
# Targets google/diffusiongemma-26B-A4B-it: a 128-expert (8 active) Gemma-4
# MoE whose causal *encoder* and bidirectional diffusion *decoder* share all
# backbone weights. Everything below runs in encoder (causal) mode on the HF
# side; the AWQ fold is attention-mask-agnostic, so it is valid for both
# modes. Requires the llama.cpp pin with `diffusion-gemma` support (see
# CLAUDE.md setup — PR #24423).
#
# MoE specifics handled by the pipeline:
#   * `L{i}_moe` groups fold the scale into pre_feedforward_layernorm_2; the
#     router reads the raw residual through its own norm, so routing logits
#     are exactly invariant.
#   * The α search scores a deterministic 8-expert subsample of each fused
#     gate_up stack (moe_expert_sample) — the scale is shared group-wide.
#   * The folded-F16 imatrix is re-weighted per expert with `hybrid_custom`;
#     expert coverage is checked after llama-imatrix (raise train_max_tokens
#     if the WARN fires: unobserved experts quantize unprotected).
#
# Bench/eval caveats (encoder-mode):
#   * llama-imatrix/llama-perplexity run the UNIFIED forward — the last
#     `canvas_length` (256) positions of each chunk are processed in
#     bidirectional canvas mode. Quant-vs-quant KLD stays valid (identical
#     computation on both sides); absolute PPL is not deployment-faithful.
#   * llama-bench decode tok/s is NOT how this model generates; use
#     scripts/bench_diffusion_speed.py for denoising throughput.
#   * Tool-call/MMLU-Pro eval needs the diffusion backend
#     (quant_tuner.eval.diffusion_server), not llama-server.
#
# Resources: bf16 HF load ≈ 52 GB (AWQ calibrate/apply) — 80GB-class GPU or
# ≥96 GB RAM with device: cpu. Disk ≥ 220 GB (HF + F16 + folded HF/F16 +
# quant + KLD baseline).
name: iq2_m_diffusiongemma_awq

model: google/diffusiongemma-26B-A4B-it

workspace: ./out/iq2_m_diffusiongemma_awq

data:
  logs: PLACEHOLDER
  train_frac: 0.8
  test_frac: 0.1
  holdout_frac: 0.1
  # 128 experts x 8 active: expert coverage needs a larger corpus than dense
  # models — the post-imatrix coverage check warns below 95%.
  train_max_tokens: 500000
  eval_max_tokens: 30000
  supplement: ./calibration_supplement.txt
  context_len: 16384

calibration:
  method: awq
  variant: best
  params:
    proxy_tokens: 256
    # proxy: iq2_s          # auto-selected from quantize.type; uncomment to pin
    imatrix_variant: hybrid_custom
    rmsnorm_plus_one: true  # Gemma (1+γ) RMSNorm convention
    moe_expert_sample: 8
    sanity_max_rel: 0.03

quantize:
  type: IQ2_M

bench:
  # KLD vs the F16 reference on external raw text; cap eval tokens — the
  # 262k-token Gemma vocab makes the KLD baseline file large.
  suite: full
  eval_ctx: 8192
