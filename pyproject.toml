[project]
name = "quant-tuner"
version = "0.1.0"
description = "Calibrate your own GGUF quantizations from real usage logs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "K. Pearson" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "transformers>=5.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",  # not imported directly; typer uses it for CLI help/tracebacks
    "openai>=2.37.0",
    "requests>=2.34.2",
    "datasets>=2.18",
    "matplotlib>=3.10.9",
    "llama-cpp-python>=0.3.2",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
redteam = [
    "deepteam>=0.5",
    "deepeval>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]
# Agentic SWE-rebench benchmark (eval/swebench.py). mini-swe-agent drives the
# model over the OpenAI-compatible llama-server endpoint inside a per-instance
# Docker container; grading runs the instance's FAIL_TO_PASS/PASS_TO_PASS tests.
# Requires a running Docker daemon — see CLAUDE.md for the Apple-Silicon caveat.
swebench = [
    "mini-swe-agent==2.4.1",  # pin: DefaultAgent/LitellmModel/DockerEnvironment API is version-sensitive
]

[project.scripts]
quant-tuner = "quant_tuner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_tuner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",  # Typer relies on function-call defaults (typer.Option) — idiomatic.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
