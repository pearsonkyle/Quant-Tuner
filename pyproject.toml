[project]
name = "quant-tuner"
version = "0.1.0"
description = "Calibrate your own GGUF quantizations from real usage logs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "K. Pearson" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "transformers>=5.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",  # not imported directly; typer uses it for CLI help/tracebacks
    "openai>=2.37.0",
    "requests>=2.34.2",
    "datasets>=2.18",
    "matplotlib>=3.10.9",
    "llama-cpp-python>=0.3.2",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Red-team safety eval (eval/red_team.py). deepteam drives the attack simulation
# and judging; deepeval supplies the model wrapper base class. Both are imported
# LAZILY inside the functions that need them, so the scoring/pairing layers stay
# importable — and unit-testable — without this extra installed.
#
# ⚠️ Install this extra under Python <= 3.12. deepteam 1.0.7 carries a stray
# (unused) `from nntplib import NNTPDataError` at the top of test_case.py, and
# nntplib was removed in 3.13 — so `import deepteam` fails there despite the
# package metadata advertising `<3.14`. This is specific to 1.0.7: 1.0.6 has no
# such import and does run on 3.13, but it predates the `Hallucination`
# vulnerability, so `_VULN_SPECS` loses one entry (verified against both).
redteam = [
    "deepteam>=1.0.7",  # pin: all 36 _VULN_SPECS + 22 _ATTACK_SPECS resolve here; reuse_simulated_test_cases verified
    "deepeval>=3.6.2",  # DeepEvalBaseLLM surface used by eval/red_team.LocalLLM (tested against 4.1.4)
]
# Agentic SWE-rebench benchmark (eval/swebench.py). mini-swe-agent drives the
# model over the OpenAI-compatible llama-server endpoint inside a per-instance
# Docker container; grading runs the instance's FAIL_TO_PASS/PASS_TO_PASS tests.
# Requires a running Docker daemon — see CLAUDE.md for the Apple-Silicon caveat.
swebench = [
    "mini-swe-agent==2.4.1",  # pin: DefaultAgent/LitellmModel/DockerEnvironment API is version-sensitive
    # OpenAI Agents SDK backend (eval/agents/openai_agents.py). Reuses
    # mini-swe-agent's Docker env layer; drives its own planning loop against the
    # same OpenAI-compatible llama-server. Pin verified against the SDK surface
    # OpenAIChatCompletionsModel / Runner.run / result.context_wrapper.usage.
    "openai-agents>=0.2",
]

[project.scripts]
quant-tuner = "quant_tuner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_tuner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",  # Typer relies on function-call defaults (typer.Option) — idiomatic.
]

[tool.ruff.lint.per-file-ignores]
# The Jacobian-lens code (adapted from igorbarshteyn/jlens-gguf) and its tests
# use `l` for a layer index throughout the numpy readout/transport math, as the
# reference implementation does. Renaming would diverge from upstream and hurt
# readability of the lens algebra, so E741 is scoped-ignored here only.
"src/quant_tuner/lens/*.py" = ["E741"]
"tests/unit/test_lens_*.py" = ["E741"]
"tests/integration/test_lens_*.py" = ["E741"]
# Vendored VERBATIM from SWE-rebench-V2 (MIT) — see the module docstring and NOTICE.
# Grading is only correct if these parsers stay byte-compatible with the harness that
# produced the dataset's recorded test ids, so we do not reformat them.
"src/quant_tuner/eval/_swerebench_v2_parsers.py" = ["ALL"]

[tool.mypy]
# Optional-extra and untyped third-party modules. These are imported lazily
# (inside the functions that need them) so the rest of the package stays usable
# without the extra installed — which also means mypy will never find stubs for
# them in a base env. Silencing the import errors keeps real type errors visible.
[[tool.mypy.overrides]]
module = [
    "deepteam.*",
    "deepeval.*",
    "minisweagent.*",
    "agents.*",
    "yaml",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: needs a built jlens-server + a tiny GGUF (QT_LENS_IT=1, QT_TINY_GGUF=…)",
]
