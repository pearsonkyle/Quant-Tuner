[project]
name = "quant-tuner"
version = "0.1.0"
description = "Calibrate your own GGUF quantizations from real usage logs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "K. Pearson" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "transformers>=5.0",
    "tokenizers>=0.22",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=2.37.0",
    "requests>=2.34.2",
    "jsonschema>=4.26.0",
    "datasets>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
quant-tuner = "quant_tuner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_tuner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",  # Typer relies on function-call defaults (typer.Option) — idiomatic.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
