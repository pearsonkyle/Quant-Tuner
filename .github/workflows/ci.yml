name: CI

on:
  push:
    branches: [main]
  pull_request:

# Hard gates (must pass): ruff, mkdocs build.
# Informational (failures are reported but do not block the PR): pytest, mypy.
# The repo has pre-existing torch-3.x test failures and a mypy debt; those are
# tracked separately and will be fixed in their own PRs. The PR gate is the
# lint + docs build, which are both clean.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests examples

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build the docs site
        run: mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: pre-existing torch-3.x failures
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (all extras except redteam, which needs Python <= 3.12)
        run: uv sync --extra dev --extra swebench --extra vllm-ptq

      - name: Unit tests
        run: uv run pytest -q

  types:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: pre-existing mypy debt
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: uv sync --extra dev

      - name: MyPy
        run: uv run mypy src

  pages:
    needs: [lint, docs]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build the docs site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
